<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Encomm Benchmark — Images</title></head>
<body>
<h1>Image-heavy page (generated local assets)</h1>
<div id="gallery"></div>
<script>
(function () {
  // Generate 40 canvas thumbnails locally — no network requests.
  var g = document.getElementById('gallery');
  for (var i = 0; i < 40; i++) {
    var c = document.createElement('canvas');
    c.width = 120; c.height = 90;
    var ctx = c.getContext('2d');
    ctx.fillStyle = 'rgb(' + (i * 6 % 255) + ',' + (i * 13 % 255) + ',' + (i * 29 % 255) + ')';
    ctx.fillRect(0, 0, 120, 90);
    ctx.fillStyle = '#fff';
    ctx.fillText('img ' + i, 10, 20);
    g.appendChild(c);
  }
})();
</script>
</body>
</html>
