<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Encomm Benchmark — JS timer</title></head>
<body>
<h1>JS timer page</h1>
<p>Counter: <span id="counter">0</span></p>
<script>
(function () {
  var n = 0;
  setInterval(function () { n++; document.getElementById('counter').textContent = String(n); }, 1000);
})();
</script>
</body>
</html>
