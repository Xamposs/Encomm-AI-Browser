name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x
      - name: Build (Release)
        run: dotnet build src/Encomm.Browser.App/Encomm.Browser.App.csproj -c Release
      - name: Unit tests
        run: dotnet test tests/Encomm.Browser.Tests/Encomm.Browser.Tests.csproj -c Release
