name: build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Encomm.sln

      - name: Build
        run: dotnet build Encomm.sln -c Release --no-restore

      - name: Test
        run: dotnet test Encomm.sln -c Release --no-build --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/TestResults/**/*.trx'
          if-no-files-found: ignore

  # NOTE: This workflow intentionally does NOT sign or publish binaries.
  # Signing keys / secrets must NEVER be added to a public CI YAML.